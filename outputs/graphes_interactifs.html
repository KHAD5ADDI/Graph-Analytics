<style>
/* Layout: a tool page. Header with tabs, one control row, then the network canvas
   beside a details panel (stacked below on phones). Community colours are the same
   as the report figures, so slides, report and this page match. */
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --ink: #1d2024;
  --ink-2: #4c5157;
  --ink-3: #7b8087;
  --line: #e2e0d9;
  --edge: 60, 64, 70;
  --accent: #a3471b;
  --f-display: "Alegreya", Georgia, "Times New Roman", serif;
  --f-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1d2024; --ink: #ecebe6; --ink-2: #b8b9b6; --ink-3: #8a8d90;
    --line: #2f3338; --edge: 210, 212, 214; --accent: #e08a5a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1d2024; --ink: #ecebe6; --ink-2: #b8b9b6; --ink-3: #8a8d90;
  --line: #2f3338; --edge: 210, 212, 214; --accent: #e08a5a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
}
.wrap { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.6rem, 3.2vw, 2.3rem); line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--ink-2); margin: 4px 0 0; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { font: 500 15px var(--f-body); border: 0; background: none; color: var(--ink-2); padding: 7px 16px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.field { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
input[type="search"], select {
  font: 15px var(--f-body); color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 0;
}
input[type="search"] { width: 220px; max-width: 100%; }
.toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; font: 14px var(--f-body); color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 8px; cursor: pointer;
}
.chip .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.chip .n { font-family: var(--f-data); font-size: 12px; color: var(--ink-3); }
.chip[aria-pressed="false"] { opacity: .42; }
.chip[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
.stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; height: min(76vh, 760px); min-height: 380px; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
canvas.dragging { cursor: grabbing; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 34px; height: 34px; font: 600 17px var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
.zoom button.wide { font-size: 12px; }
.stage-note { position: absolute; left: 12px; bottom: 10px; font-size: 13px; color: var(--ink-3); pointer-events: none; max-width: calc(100% - 24px); }
.tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px;
  padding: 7px 10px; font-size: 13px; line-height: 1.35; max-width: 240px; z-index: 3;
}
.tip b { font-size: 14px; }
.tip .m { font-family: var(--f-data); font-size: 12px; opacity: .85; }
aside { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
aside h2 { font-family: var(--f-display); font-size: 1.45rem; margin: 0; line-height: 1.15; overflow-wrap: anywhere; }
aside h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 6px; font-weight: 700; }
aside p { margin: 0; color: var(--ink-2); font-size: 15px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); }
.badge .dot { width: 10px; height: 10px; border-radius: 50%; }
.bridge-tag { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 8px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td { padding: 5px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
td.v { text-align: right; font-family: var(--f-data); font-variant-numeric: tabular-nums; font-size: 13px; }
td.r { text-align: right; color: var(--ink-3); font-size: 12px; width: 76px; font-variant-numeric: tabular-nums; }
.nb { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.nb button { width: 100%; display: grid; grid-template-columns: 10px minmax(0, 1fr) 70px 46px; gap: 8px; align-items: center; background: none; border: 0; padding: 4px 2px; font: 14px var(--f-body); color: var(--ink); text-align: left; cursor: pointer; border-radius: 6px; }
.nb button:hover { background: var(--bg); }
.nb .dot { width: 9px; height: 9px; border-radius: 50%; }
.nb .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nb .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.nb .bar i { display: block; height: 100%; background: var(--ink-3); border-radius: 3px; }
.nb .w { font-family: var(--f-data); font-size: 12px; color: var(--ink-2); text-align: right; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { border-top: 1px solid var(--line); padding-top: 6px; }
.stat .k { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.stat .v { font-family: var(--f-data); font-size: 18px; }
.list { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: 15px; }
.list li { padding: 1px 0; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.ghost { align-self: flex-start; font: 14px var(--f-body); color: var(--ink-2); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; cursor: pointer; }
footer { color: var(--ink-3); font-size: 13px; }
@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .stage { height: 62vh; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>The Hidden Bridges of World Cuisines</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="tabs" role="tablist" aria-label="Graphe affiché">
      <button role="tab" id="tab-ingredients" aria-selected="true" data-key="ingredients">Ingrédients</button>
      <button role="tab" id="tab-pays" aria-selected="false" data-key="pays">Pays</button>
    </div>
  </header>

  <div class="controls">
    <label class="field" for="q">Chercher
      <input type="search" id="q" list="names" placeholder="ex. Cumin, Morocco" autocomplete="off">
      <datalist id="names"></datalist>
    </label>
    <label class="field" for="size">Taille des nœuds
      <select id="size">
        <option value="force">Force (somme des poids)</option>
        <option value="btw">Intermédiarité</option>
        <option value="eig">Vecteur propre</option>
        <option value="part">Participation</option>
      </select>
    </label>
    <label class="field" for="color" id="color-field" hidden>Couleur
      <select id="color">
        <option value="c">Communautés (Louvain)</option>
        <option value="region">Régions de l'ONU</option>
      </select>
    </label>
    <label class="toggle" for="bridges" id="bridges-field"><input type="checkbox" id="bridges"> Ne montrer que les ponts</label>
  </div>

  <div class="legend" id="legend" aria-label="Filtrer par groupe"></div>

  <div class="main">
    <div class="stage" id="stage">
      <canvas id="cv" aria-label="Réseau interactif"></canvas>
      <div class="zoom">
        <button id="zin" aria-label="Zoomer">+</button>
        <button id="zout" aria-label="Dézoomer">−</button>
        <button id="zfit" class="wide" aria-label="Recentrer">⤢</button>
      </div>
      <div class="stage-note" id="note"></div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>

  <footer id="foot"></footer>
</div>

      <h2>${esc(n.id)}</h2>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
        <span class="badge"><span class="dot" style="background:${PALETTE[n.c % PALETTE.length]}"></span>Communauté ${n.c}</span>
        ${S.key === "pays" ? `<span class="badge"><span class="dot" style="background:${(REGIONS[n.region] || ["", "#999"])[1]}"></span>${(REGIONS[n.region] || [n.region])[0]}</span>` : ""}
        ${n.bridge ? `<span class="bridge-tag">Ingrédient pont</span>` : ""}
      </div>
      <p>${meta}</p>
    </div>
    <div><h3>Mesures (graphe complet)</h3><table>${rows}</table></div>
    <div><h3>Liens les plus forts (${gr.weight_label})</h3><ul class="nb">${nbs}</ul></div>
    <button class="ghost" id="clear">Désélectionner</button>`;
  bindPanel();
}

function summaryHTML() {
  const gr = g();
  const comms = gr.communities.map(c =>
    `<li><span style="color:${PALETTE[c.id % PALETTE.length]}">●</span> <b>C${c.id}</b> (${c.size}) : ${c.top.map(t => `<button class="link" data-go="${esc(t)}">${esc(short(t))}</button>`).join(", ")}</li>`).join("");
  const key = S.key === "ingredients";
  const topB = [...gr.nodes].sort((a, b) => b.btw - a.btw).slice(0, 5)
    .map(n => `<button class="link" data-go="${esc(n.id)}">${esc(short(n.id))}</button>`).join(", ");
  const bridges = key ? gr.nodes.filter(n => n.bridge).sort((a, b) => b.part - a.part)
    .map(n => `<button class="link" data-go="${esc(n.id)}">${esc(n.id)}</button>`).join(", ") : "";
  return `
    <div><h3>${key ? "Graphe des ingrédients" : "Graphe des pays"}</h3>
      <p>${key ? "Deux ingrédients sont reliés s'ils apparaissent ensemble dans les recettes plus souvent que le hasard ne le prévoit (PMI)."
               : "Deux pays sont reliés si leurs plats nationaux partagent assez d'ingrédients (Jaccard ≥ 0,3)."}</p></div>
    <div class="stats">
      <div class="stat"><div class="k">Nœuds</div><div class="v">${gr.n_nodes}</div></div>
      <div class="stat"><div class="k">Arêtes</div><div class="v">${gr.n_edges.toLocaleString("fr-FR")}</div></div>
    </div>
    ${key ? `<div><h3>Ingrédients ponts</h3><p>Participation la plus élevée (degré ≥ 20) : ${bridges}.</p></div>` : ""}
    <div><h3>Intermédiarité la plus forte</h3><p>${topB}</p></div>
    <div><h3>Communautés (Louvain)</h3><ul class="list">${comms}</ul></div>
    <p style="font-size:14px">Cliquez sur un nœud pour voir ses mesures et ses liens les plus forts. Faites glisser pour vous déplacer, molette ou pincement pour zoomer.</p>`;
}
function bindPanel() {
  $("panel").querySelectorAll("[data-go]").forEach(b => b.onclick = () => select(b.dataset.go));
  const c = $("clear"); if (c) c.onclick = () => select(null);
}

/* ---------- legend, controls, tabs ---------- */
function renderLegend() {
  const gr = g(), L = $("legend");
  let groups;
  if (S.key === "pays" && S.color === "region")
    groups = Object.entries(REGIONS).map(([k, [name, col]]) => ({ id: k, name, col, n: gr.nodes.filter(n => n.region === k).length }));
  else groups = gr.communities.map(c => ({ id: c.id, name: `C${c.id} · ${c.top.slice(0, 2).map(short).join(", ")}`, col: PALETTE[c.id % PALETTE.length], n: c.size }));
  L.innerHTML = groups.map(x =>
    `<button class="chip" data-g="${esc(x.id)}" aria-pressed="${!S.hidden.has(x.id)}"><span class="dot" style="background:${x.col}"></span>${esc(x.name)}<span class="n">${x.n}</span></button>`).join("");
  L.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const id = groups.find(x => String(x.id) === b.dataset.g).id;
    S.hidden.has(id) ? S.hidden.delete(id) : S.hidden.add(id);
    b.setAttribute("aria-pressed", String(!S.hidden.has(id))); draw();
  });
}
function setKey(key) {
  S.key = key; S.sel = null; S.hover = null; S.hidden.clear(); $("q").value = "";
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.key === key)));
  $("color-field").hidden = key !== "pays"; $("bridges-field").hidden = key !== "ingredients";
  const gr = g();
  $("sub").textContent = key === "ingredients"
    ? "Quels ingrédients relient les traditions culinaires ?"
    : "Les proximités culinaires suivent-elles la géographie ?";
  $("note").textContent = `Affichage : ${gr.n_shown.toLocaleString("fr-FR")} arêtes les plus fortes sur ${gr.n_edges.toLocaleString("fr-FR")}. Les mesures portent sur le graphe complet.`;
  $("foot").textContent = `Source : ${gr.source}. Couleurs identiques aux figures du rapport.`;
  $("names").innerHTML = gr.nodes.map(n => `<option value="${esc(n.id)}"></option>`).join("");
  fit(); renderLegend(); renderPanel(); draw();
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => setKey(b.dataset.key));
$("size").onchange = e => { S.size = e.target.value; draw(); if (S.sel) renderPanel(); };
$("color").onchange = e => { S.color = e.target.value; S.hidden.clear(); renderLegend(); draw(); };
$("bridges").onchange = e => { S.bridgesOnly = e.target.checked; draw(); };
$("q").addEventListener("input", () => {
  const v = $("q").value.trim(), n = g().byId.get(v) || [...g().byId.values()].find(x => x.id.toLowerCase() === v.toLowerCase());
  if (n) select(n.id); else draw();
});
$("q").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const v = $("q").value.trim().toLowerCase(); if (!v) return;
  const n = g().nodes.find(x => x.id.toLowerCase().startsWith(v)) || g().nodes.find(x => x.id.toLowerCase().includes(v));
  if (n) select(n.id);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sel) select(null); });

setKey("ingredients");
</script>

</body>
</html>
